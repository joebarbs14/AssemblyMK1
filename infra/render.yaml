databases:
  - name: assembly-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: assembly-web
    runtime: node
    region: singapore
    plan: free
    rootDir: apps/web
    buildCommand: |
      npm install -g pnpm@9.12.0
      cd ../.. && pnpm install --frozen-lockfile
      cd apps/web && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      - key: AUTH_SECRET
        generateValue: true

  - type: web
    name: assembly-api
    runtime: python
    region: singapore
    plan: free
    rootDir: apps/api
    buildCommand: |
      pip install --upgrade pip
      pip install -e .
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: assembly-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Auth (residents)
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      # Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_MEDIA
        sync: false
      - key: R2_BUCKET_PMTILES
        sync: false
      # PayPal
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Web Push
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Email
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER_DOMAIN
        sync: false

# NOTE: region is set to "singapore" because Render's Sydney region key is
# "sydney" only on paid Pro plans at the time of writing. Change to
# `region: sydney` once the team is on a plan that supports it.
# Redis + worker services will be added in M3-M4 (push fan-out, offline sync).
